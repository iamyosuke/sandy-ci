name: macOS validation

on:
  repository_dispatch:
    types: [sandy-private-request]

permissions:
  contents: read

run-name: sandy-public-ci-${{ github.event.client_payload.request_id }}-${{ github.event.client_payload.request_run_id }}

env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
  SANDY_REQUEST_ID: ${{ github.event.client_payload.request_id }}
  SANDY_REQUEST_RUN_ID: ${{ github.event.client_payload.request_run_id }}

jobs:
  prepare:
    name: prepare
    if: github.event.action == 'sandy-private-request' && github.run_attempt == 1
    runs-on: macos-26-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Fetch source and request
        id: fetch
        env:
          SANDY_SOURCE_TOKEN: ${{ secrets.SANDY_SOURCE_TOKEN }}
        run: ./runner/run-public-ci.sh fetch
      - name: Run prepare
        timeout-minutes: 30
        run: ./runner/run-public-ci.sh prepare
      - name: Encrypt prepare evidence
        id: encrypt
        if: ${{ always() && steps.fetch.outcome == 'success' }}
        env:
          SANDY_CI_RECIPIENT_CERT: ${{ vars.SANDY_CI_RECIPIENT_CERT }}
        run: ./runner/run-public-ci.sh encrypt-prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() && steps.encrypt.outcome == 'success' }}
        with:
          name: sandy-ci-prepare-${{ github.event.client_payload.request_id }}
          path: ${{ runner.temp }}/sandy-private/prepare.bundle.cms
          retention-days: 2
          if-no-files-found: error

  lane-a:
    name: lane-a
    needs: prepare
    if: always() && needs.prepare.result == 'success'
    runs-on: macos-26-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Fetch source
        id: fetch
        env:
          SANDY_SOURCE_TOKEN: ${{ secrets.SANDY_SOURCE_TOKEN }}
        run: ./runner/run-public-ci.sh fetch
      - name: Run lane
        timeout-minutes: 105
        env:
          SANDY_OPAQUE_LANE: a
        run: ./runner/run-public-ci.sh run-lane
      - name: Encrypt lane result
        id: encrypt
        if: ${{ always() && steps.fetch.outcome == 'success' }}
        env:
          SANDY_CI_RECIPIENT_CERT: ${{ vars.SANDY_CI_RECIPIENT_CERT }}
          SANDY_RESULT_ID: a
        run: ./runner/run-public-ci.sh encrypt-result
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() && steps.encrypt.outcome == 'success' }}
        with:
          name: sandy-ci-result-a
          path: ${{ runner.temp }}/sandy-private/result-a.bundle.cms
          retention-days: 2
          if-no-files-found: error

  lane-b:
    name: lane-b ${{ matrix.id }}
    needs: prepare
    if: always() && needs.prepare.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: 1, opaque: b-1}
          - {id: 2, opaque: b-2}
          - {id: 3, opaque: b-3}
          - {id: 4, opaque: b-4}
          - {id: 5, opaque: b-5}
    runs-on: macos-26-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Fetch source
        id: fetch
        env:
          SANDY_SOURCE_TOKEN: ${{ secrets.SANDY_SOURCE_TOKEN }}
        run: ./runner/run-public-ci.sh fetch
      - name: Run lane
        timeout-minutes: 105
        env:
          SANDY_OPAQUE_LANE: ${{ matrix.opaque }}
        run: ./runner/run-public-ci.sh run-lane
      - name: Encrypt lane result
        id: encrypt
        if: ${{ always() && steps.fetch.outcome == 'success' }}
        env:
          SANDY_CI_RECIPIENT_CERT: ${{ vars.SANDY_CI_RECIPIENT_CERT }}
          SANDY_RESULT_ID: ${{ matrix.opaque }}
        run: ./runner/run-public-ci.sh encrypt-result
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() && steps.encrypt.outcome == 'success' }}
        with:
          name: sandy-ci-result-${{ matrix.opaque }}
          path: ${{ runner.temp }}/sandy-private/result-${{ matrix.opaque }}.bundle.cms
          retention-days: 2
          if-no-files-found: error

  lane-c:
    name: lane-c ${{ matrix.id }}
    needs: prepare
    if: always() && needs.prepare.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: 1, opaque: c-1}
          - {id: 2, opaque: c-2}
    runs-on: macos-26-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Fetch source
        id: fetch
        env:
          SANDY_SOURCE_TOKEN: ${{ secrets.SANDY_SOURCE_TOKEN }}
        run: ./runner/run-public-ci.sh fetch
      - name: Run lane
        timeout-minutes: 105
        env:
          SANDY_OPAQUE_LANE: ${{ matrix.opaque }}
        run: ./runner/run-public-ci.sh run-lane
      - name: Encrypt lane result
        id: encrypt
        if: ${{ always() && steps.fetch.outcome == 'success' }}
        env:
          SANDY_CI_RECIPIENT_CERT: ${{ vars.SANDY_CI_RECIPIENT_CERT }}
          SANDY_RESULT_ID: ${{ matrix.opaque }}
        run: ./runner/run-public-ci.sh encrypt-result
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() && steps.encrypt.outcome == 'success' }}
        with:
          name: sandy-ci-result-${{ matrix.opaque }}
          path: ${{ runner.temp }}/sandy-private/result-${{ matrix.opaque }}.bundle.cms
          retention-days: 2
          if-no-files-found: error
